# dsh-lab host composition bundle. Applied as the host-plane rows of the
# profile. Each row is a separate fiber with its own inject declaration so
# HMR can replace them individually:
#
#   lab-service       → provides ctx.lab (needs workspaceRegistry)
#   lab-tools         → lab_* model tools (needs lab + tools)
#   lab-rpc           → /dlab Connection RPC channel (needs lab + connection)
#   lab-shell-env     → DSH_LAB_* shell variables (needs lab + shellEnv)
#   lab-system-prompt → lab:context prompt section (needs lab + systemPrompt)
#
# Lab resolution is PER SESSION cwd — no root is hardcoded here. Every
# consumer (agent tools, prompt section, shell env, browser panel) resolves
# the lab project that owns the session's working directory: any directory
# holding an initialized .dsh-lab/lab.sqlite (walking up from the cwd) is a
# lab. To pin one primary lab for the deployment, set solutionRoot /
# projectName on the lab-service row; the pinned root wins only for sessions
# whose cwd sits inside it (and for cwd-less callers).

- insert:
    - id: lab-service
      name: '@dsh-lab/host'

    - id: lab-tools
      name: '@dsh-lab/host/tools'

    - id: lab-rpc
      name: '@dsh-lab/host/rpc'

    - id: lab-shell-env
      name: '@dsh-lab/host/shell-env'

    - id: lab-system-prompt
      name: '@dsh-lab/host/system-prompt'
