# dsh-lab host composition bundle. Applied as the host-plane rows of the
# profile. Each row is a separate fiber with its own inject declaration so
# HMR can replace them individually:
#
#   lab-service       → provides ctx.lab (needs workspaceRegistry)
#   lab-tools         → lab_* model tools (needs lab + tools)
#   lab-rpc           → /dlab Connection RPC channel (needs lab + connection)
#   lab-shell-env     → DSH_LAB_* shell variables (needs lab + shellEnv)
#   lab-system-prompt → lab:context prompt section (needs lab + systemPrompt)
#
# solutionRoot must point at the user's lab root (the directory holding
# solutions/, experiments/, .dsh-lab/).

- insert:
    - id: lab-service
      name: '@dlab/lab-host'
      config:
        solutionRoot: /home2/zhanghanjin/WorkSpace/dsh-scholar
        projectName: dsh-scholar

    - id: lab-tools
      name: '@dlab/lab-host/tools'

    - id: lab-rpc
      name: '@dlab/lab-host/rpc'

    - id: lab-shell-env
      name: '@dlab/lab-host/shell-env'

    - id: lab-system-prompt
      name: '@dlab/lab-host/system-prompt'
