name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + unit + per-package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime packages
        run: pnpm build

      - name: Unit tests (tests/unit)
        run: pnpm test:unit

      - name: Per-package tests (packages/*)
        # Each package's test script is `vitest run`; packages without any
        # tests yet exit 1 by default, so pass --passWithNoTests so empty
        # packages don't fail the build. Add real tests inside a package
        # and they will be picked up here automatically.
        run: pnpm -r --filter './packages/**' exec vitest run --passWithNoTests