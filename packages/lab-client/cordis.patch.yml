# dsh-lab client composition bundle.
#
# The host row below mounts the package's (no-op) host half so the client-
# modules scanner discovers its `dsh.client` declaration and serves the
# browser bundle at /plugins/@dsh-lab/client/client.js.
#
# Browser half (lib/client.js, hand-written module bundle), all inside the
# OFFICIAL native right Sidebar (no third-party sidebar integration):
#   - a "DLab" page tab type via ctx.sidebarRightTabs.register (kind
#     'dsh-lab', with a guide entry on the sidebar's guide page)
#   - the tab body via the keyed sidebar.right.pane.tab slot (useTabInfo)
#   - a "🧪" quick-entry button in conversation.session.header.actions that
#     opens the tab via ctx.sidebarRight.openTab
#   - data via the /dlab Connection RPC channel served by @dsh-lab/host

- insert:
    - id: dlab-client
      name: '@dsh-lab/client'
